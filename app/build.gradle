apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    namespace 'com.videofinder.playlists'
    compileSdk 36

    defaultConfig {
        applicationId "com.videofinder.playlists"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            // Google demo adaptive-banner test unit for debugging
            buildConfigField "String", "BANNER_ID", '"ca-app-pub-3940256099942544/9214589741"'
            buildConfigField "boolean", "FORCE_TEST_ADS", "true"
        }
        release {
            // YOUR REAL BANNER AD UNIT ID
            buildConfigField "String", "BANNER_ID", '"ca-app-pub-9986266613234652/4193483068"'
            buildConfigField "boolean", "FORCE_TEST_ADS", "false"
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    // GDPR / EEA / UK consent
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
}
